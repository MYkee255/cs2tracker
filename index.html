<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>CS2 Match Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main">

    <div class="header">
        <h1>CS2 Match Tracker</h1>
        <p>Meccsek rögzítése és statisztikák</p>
    </div>

    <div class="section">
        <h2>Új meccs rögzítése</h2>

        <label for="resultSelect">Eredmény:</label>
        <select id="resultSelect">
            <option value="win">Win</option>
            <option value="lose">Lose</option>
            <option value="draw">Draw</option>
        </select>

        <label for="mapSelect">Map:</label>
        <select id="mapSelect"></select>

        <label for="killsInput">Kills:</label>
        <input type="number" id="killsInput">

        <label for="deathsInput">Deaths:</label>
        <input type="number" id="deathsInput">

        <label for="assistsInput">Assists:</label>
        <input type="number" id="assistsInput">

        <button id="saveBtn">Mentés</button>
    </div>

    <div class="section">
        <h2>Mentett meccsek</h2>
        <ul id="matchList"></ul>
    </div>

    <div class="footer">
        CS2 Match Tracker © 2026
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
